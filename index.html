<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTA Prototype</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="MTA_logo.png" alt="MTA logo" class="logo">
        <p class="announcement">Stand clear of the closing doors, please.</p>
    </header>
    <div class="stationContents">
        <div class="context">
            <h1 class="stationResult">This is:<span id="stationName"></span></h1>
            <img id="structureImg" src="" alt="">
            <div class="contextText">
                <p id="borough"></p>
                <p id="accessibility"></p>
            </div>
            <p id="blurb"></p>
        </div>
        <button class="CTA" id="transferButton">Next stop</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
